name: vendor-la-botica-spa
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/vendor-la-botica-spa.yml"
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vendor SPA JS, HTML, and photos
        run: |
          set -euo pipefail
          mkdir -p mukan-previews/la-botica/assets mukan-previews/la-botica/photos
          curl -fsSL https://temporary-racing-crystal-tlmw9qx.vercel.app/assets/index-DGrpCQ0z.js \
            | python3 -c 'import sys; t=sys.stdin.read(); sys.stdout.write(t.replace("src:`/photos/","src:`./photos/"))' \
            > mukan-previews/la-botica/assets/index-DGrpCQ0z.js
          test "$(git hash-object mukan-previews/la-botica/assets/index-DGrpCQ0z.js)" = "04269b034c887aff13be888d93edc134ade3bcf2"
          for f in fachada-noche.jpg salon.jpg barra.jpg tapas.jpg extra.jpg fachada.jpg terraza-noche.jpg; do
            curl -fsSL "https://temporary-racing-crystal-tlmw9qx.vercel.app/photos/$f" -o "mukan-previews/la-botica/photos/$f"
          done
          cat > mukan-previews/la-botica/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="es-ES">
            <head>
              <meta charset="UTF-8" />
              <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <meta name="robots" content="noindex, nofollow" />
              <title>Bar La Botica · Tapas en Córdoba</title>
              <script type="module" crossorigin src="./assets/index-DGrpCQ0z.js"></script>
              <link rel="stylesheet" crossorigin href="./assets/index-dsz1Rl1r.css">
            </head>
            <body>
              <div id="root"></div>
            </body>
          </html>
          HTML
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mukan-previews/la-botica/assets/index-DGrpCQ0z.js mukan-previews/la-botica/index.html mukan-previews/la-botica/photos
          if git diff --cached --quiet; then echo no changes; else git commit -m "Vendor Bar La Botica Córdoba SPA JS, HTML, and photos"; git push; fi
